services:
  - type: web
    name: drift-doctor-agent
    runtime: docker
    rootDir: agent
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /health

    envVars:
      - key: GROQ_API_KEY
        sync: false

      - key: MODEL_NAME
        value: llama-3.1-8b-instant

  - type: web
    name: drift-doctor-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /api/health

    envVars:
      - key: AGENT_URL
        fromService:
          type: web
          name: drift-doctor-agent
          envVarKey: RENDER_EXTERNAL_URL

      - key: DB_PATH
        value: /tmp/drift_doctor.db

  - type: web
    name: drift-doctor-frontend
    runtime: docker
    rootDir: frontend
    dockerfilePath: Dockerfile
    plan: free

    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: drift-doctor-backend
          envVarKey: RENDER_EXTERNAL_URL
